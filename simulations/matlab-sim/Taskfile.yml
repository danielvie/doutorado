version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  run:
    desc: Run the main LAB_CIRCUIT simulation
    cmds:
      - matlab -batch "t('play', 'lab')"

  matlab:
    desc: Start a MATLAB REPL through the Python Engine API
    cmds:
      - uvx --no-config --python 3.12 --with "matlabengine==25.2.2" python python/matlab_repl.py

  test:
    desc: Run the MATLAB test suite
    cmds:
      - matlab -batch "t('test')"

  test-domain-model:
    desc: Run the focused domain-model check
    cmds:
      - matlab -batch "z_run.Tests.test_domain_model()"

  test-run-flow:
    desc: Run the focused Simulation.run flow check
    cmds:
      - matlab -batch "z_run.Tests.test_run_flow()"

  clear:
    desc: Remove generated simulation outputs
    cmds:
      - matlab -batch "t('clean')"
