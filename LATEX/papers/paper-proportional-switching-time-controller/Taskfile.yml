version: '3'

vars:
  DOCUMENT: main
  OUTPUT: article

includes:
  lyapunov:
    taskfile: ./studies/lyapunov/Taskfile.yml
    dir: ./studies/lyapunov

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  results:
    desc: Solve the Julia certificate and regenerate article evidence
    cmds:
      - task: lyapunov:default
      - matlab -batch "run('scripts/generate_results.m')"

  figures:
    desc: Alias for results, regenerates all article evidence
    cmds:
      - task: results

  replot:
    desc: Redraw main-text numerical figures from saved data without rerunning simulations
    cmds:
      - matlab -batch "addpath('scripts'); paper.replot_figures;"

  test:
    desc: Check the conditioner, model, and pipeline data contracts without exporting
    cmds:
      - matlab -batch "suite = runtests('tests'); assertSuccess(suite);"

  test-regeneration:
    desc: Regenerate in a temporary directory and compare with stored article evidence
    cmds:
      - matlab -batch "addpath('tests'); check_regeneration;"

  check-links:
    desc: Check local Markdown and HTML links outside historical archives
    cmds:
      - python scripts/check_links.py

  trajectory-comparison:
    desc: Regenerate the standalone trajectory-comparison study
    cmds:
      - matlab -batch "run('studies/trajectory-comparison/generate_comparison.m')"

  beta-timing:
    desc: Benchmark host MATLAB/C++ beta computation and export article timings
    cmds:
      - python studies/beta-timing/run.py
      - python studies/beta-timing/export_latex.py

  invariant-region:
    desc: Regenerate the fixed-factor feasible-region figure and vertex data
    cmds:
      - matlab -batch "addpath('scripts'); generate_feasible_regions;"

  build:
    desc: Compile the article PDF and refresh the editor preview
    dir: latex
    cmds:
      - latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=../build {{.DOCUMENT}}.tex
      - cp -f ../build/{{.DOCUMENT}}.pdf ../{{.OUTPUT}}.pdf

  run:
    desc: Build the article
    deps: [build]

  clean:
    desc: Remove generated LaTeX build files
    dir: latex
    cmds:
      - latexmk -C {{.DOCUMENT}}.tex
      - rm -f {{.DOCUMENT}}.bbl
      - rm -rf ../build

  verify:
    desc: Regenerate results and compile the article
    cmds:
      - task: test
      - task: check-links
      - task: results
      - task: build
