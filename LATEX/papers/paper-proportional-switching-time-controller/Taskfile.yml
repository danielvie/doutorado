version: '3'

vars:
  DOCUMENT: main
  OUTPUT: article

includes:
  lyapunov:
    taskfile: ./studies/s1-lyapunov/Taskfile.yml
    dir: ./studies/s1-lyapunov
  conditioning-comparison:
    taskfile: ./studies/s1-marcolino-conditioning-comparison/Taskfile.yml
    dir: ./studies/s1-marcolino-conditioning-comparison
  mpc-comparison:
    taskfile: ./studies/s1-mpc-comparison/Taskfile.yml
    dir: ./studies/s1-mpc-comparison
  kawa-synthesis:
    taskfile: ./studies/s2-kawa-synthesis/Taskfile.yml
    dir: ./studies/s2-kawa-synthesis

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  results:
    desc: Export manuscript values from the saved Common-P comparison
    cmds:
      - python scripts/export_common_p_study.py

  baseline-results:
    desc: Regenerate the legacy fixed-gain LQR evidence and supporting figures
    cmds:
      - task: lyapunov:default
      - matlab -batch "run('scripts/generate_results.m')"

  figures:
    desc: Redraw Common-P comparison figures from saved data
    cmds:
      - task: replot

  replot:
    desc: Redraw Common-P comparison figures and export manuscript values without simulation
    cmds:
      - task: kawa-synthesis:replot
      - task: results

  test:
    desc: Check the conditioner, model, and pipeline data contracts without exporting
    cmds:
      - task: check-introduction
      - matlab -batch "suite = runtests('tests'); assertSuccess(suite);"

  test-regeneration:
    desc: Regenerate in a temporary directory and compare with stored article evidence
    cmds:
      - matlab -batch "addpath('tests'); check_regeneration;"

  check-introduction:
    desc: Verify the protected Introduction is unchanged
    cmds:
      - uv run --no-project python scripts/check_introduction.py

  check-links:
    desc: Check local Markdown and HTML links outside historical archives
    cmds:
      - python scripts/check_links.py

  trajectory-comparison:
    desc: Regenerate the standalone trajectory-comparison study
    cmds:
      - matlab -batch "run('studies/trajectory-comparison/generate_comparison.m')"

  beta-timing:
    desc: Benchmark host MATLAB/C++ beta computation and export article timings
    cmds:
      - python studies/beta-timing/run.py
      - python studies/beta-timing/export_latex.py

  invariant-region:
    desc: Regenerate the fixed-factor feasible-region figure and vertex data
    cmds:
      - matlab -batch "addpath('scripts'); generate_feasible_regions;"

  build:
    desc: Compile the article PDF and refresh the editor preview
    dir: latex
    cmds:
      - uv run --no-project python ../scripts/check_introduction.py
      - python ../scripts/export_common_p_study.py --check
      - latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=../build {{.DOCUMENT}}.tex
      - cp -f ../build/{{.DOCUMENT}}.pdf ../{{.OUTPUT}}.pdf

  run:
    desc: Build the article
    deps: [build]

  clean:
    desc: Remove generated LaTeX build files
    dir: latex
    cmds:
      - latexmk -C {{.DOCUMENT}}.tex
      - rm -f {{.DOCUMENT}}.bbl
      - rm -rf ../build

  verify:
    desc: Check the project, export saved Common-P results, and compile the article
    cmds:
      - task: test
      - task: check-links
      - task: kawa-synthesis:test
      - task: results
      - task: build
