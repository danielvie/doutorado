version: '3'

vars:
  DOCUMENT: article

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  figures:
    desc: Regenerate simulation figures and metrics with MATLAB
    cmds:
      - matlab -batch "run('scripts/generate_results.m')"

  trajectory-comparison:
    desc: Regenerate comparison/trajectory_comparison.pdf with MATLAB
    cmds:
      - matlab -batch "run('scripts/generate_trajectory_comparison.m')"

  build:
    desc: Compile the article PDF and refresh the editor preview
    cmds:
      - latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=build {{.DOCUMENT}}.tex
      - cp -f build/{{.DOCUMENT}}.pdf {{.DOCUMENT}}.pdf

  run:
    desc: Build the article
    deps: [build]

  clean:
    desc: Remove generated LaTeX build files
    cmds:
      - latexmk -C -outdir=build {{.DOCUMENT}}.tex
      - rm -rf build

  verify:
    desc: Regenerate results and compile the article
    cmds:
      - task: figures
      - task: build
