<title>Computing Lyapunov functions by convex optimization</title>
<style>
:root{
  --ground:#EDF0F4; --surface:#FFFFFF; --surface-2:#E4E9F0; --surface-3:#DCE3EB;
  --ink:#141C25; --ink-2:#42505F; --ink-3:#6B7789;
  --rule:#CCD4DE; --rule-strong:#A9B4C2;
  --blue:#1D5F9E; --blue-soft:#D6E4F2;
  --crimson:#C4453C; --crimson-soft:#F6DEDC;
  --teal:#17877A; --teal-soft:#D3E9E5;
  --amber:#B07A16; --amber-soft:#F6EBD2;
  --graphite:#6B7789;
  --shadow:0 1px 2px rgba(20,28,37,.06), 0 8px 24px -12px rgba(20,28,37,.18);
  --measure:36rem;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F151C; --surface:#161F29; --surface-2:#1E2934; --surface-3:#243140;
    --ink:#E6EBF1; --ink-2:#B3C0CE; --ink-3:#8593A3;
    --rule:#2B3743; --rule-strong:#3D4B59;
    --blue:#69B0E6; --blue-soft:#17304a;
    --crimson:#EC8177; --crimson-soft:#3D2320;
    --teal:#4CC6B2; --teal-soft:#123029;
    --amber:#DFAA45; --amber-soft:#33280F;
    --graphite:#8593A3;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#0F151C; --surface:#161F29; --surface-2:#1E2934; --surface-3:#243140;
  --ink:#E6EBF1; --ink-2:#B3C0CE; --ink-3:#8593A3;
  --rule:#2B3743; --rule-strong:#3D4B59;
  --blue:#69B0E6; --blue-soft:#17304a;
  --crimson:#EC8177; --crimson-soft:#3D2320;
  --teal:#4CC6B2; --teal-soft:#123029;
  --amber:#DFAA45; --amber-soft:#33280F;
  --graphite:#8593A3;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Spectral,Georgia,"Times New Roman",serif;
  font-size:17px; line-height:1.68; -webkit-font-smoothing:antialiased;
}
.page{--pad:clamp(1rem,4vw,2.5rem);
  --cols:minmax(var(--pad),1fr) minmax(0,var(--measure)) minmax(var(--pad),1fr);
  display:grid; grid-template-columns:var(--cols);}
.page > header,.page > section,.page > footer{
  grid-column:1/-1; display:grid; grid-template-columns:var(--cols); align-content:start;}
.page > header > *,.page > section > *,.page > footer > *{grid-column:2}
.page .wide{grid-column:1/-1;width:min(66rem,100% - var(--pad)*2);margin-inline:auto;max-width:none}

h1,h2,h3,h4,.eyebrow,figcaption,th,.ui{font-family:"Archivo","Helvetica Neue",Arial,sans-serif}
h1{font-size:clamp(2.1rem,5.2vw,3.2rem);line-height:1.05;letter-spacing:-.03em;font-weight:700;margin:0;text-wrap:balance}
h2{font-size:clamp(1.4rem,3vw,1.85rem);line-height:1.16;letter-spacing:-.02em;font-weight:600;margin:0;text-wrap:balance}
h3{font-size:1.1rem;font-weight:600;margin:0;letter-spacing:-.01em}
h4{font-size:.94rem;font-weight:600;margin:0;letter-spacing:.01em;color:var(--ink-2)}
p{margin:0}
.lede{font-size:clamp(1.05rem,2.2vw,1.22rem);line-height:1.55;color:var(--ink-2)}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--ink-3)}
code,.mono,.num,kbd{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
code{font-size:.86em;background:var(--surface-2);padding:.1em .34em;border-radius:3px}
.num{font-variant-numeric:tabular-nums}
a{color:var(--blue)}
strong{font-weight:600}
em{font-style:italic}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

.page > header{padding:clamp(3rem,9vw,6rem) 0 2rem}
.page > section{padding:1.6rem 0}
.page > section + section{border-top:1px solid var(--rule)}
.stack > * + *{margin-top:1.1rem}
.stack-tight > * + *{margin-top:.6rem}

/* --- callouts, equations, tables ------------------------------------- */
.eq{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:.92rem;
  background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--blue);
  border-radius:0 6px 6px 0;padding:.85rem 1rem;overflow-x:auto;line-height:1.75}
.eq.center{text-align:center}
.eq .cm{color:var(--ink-3)}
.note{background:var(--surface);border:1px solid var(--rule);border-radius:8px;
  padding:1rem 1.15rem;box-shadow:var(--shadow)}
.note.warn{border-left:3px solid var(--crimson)}
.note.key{border-left:3px solid var(--teal)}
.note.aside{background:var(--surface-2);box-shadow:none}
.note h4{margin-bottom:.35rem}
.note p + p{margin-top:.6rem}

table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:.42rem .6rem;border-bottom:1px solid var(--rule)}
th{font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
td.n,th.n{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.pass{color:var(--teal);font-weight:600}
.fail{color:var(--crimson);font-weight:600}

pre{background:var(--surface);border:1px solid var(--rule);border-radius:8px;
  padding:.9rem 1rem;overflow-x:auto;font-size:.8rem;line-height:1.6;margin:0;
  font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
pre .c{color:var(--ink-3);font-style:italic}
pre .k{color:var(--blue);font-weight:600}
pre .s{color:var(--teal)}
pre.out{background:var(--surface-2);border-left:3px solid var(--graphite)}

ul,ol{margin:0;padding-left:1.3rem}
li + li{margin-top:.35rem}

/* --- figures and labs ------------------------------------------------- */
figure{margin:0}
figcaption{font-size:.82rem;color:var(--ink-3);line-height:1.5;margin-top:.6rem}
figcaption b{color:var(--ink-2);font-weight:600}
.fig{background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:1rem;box-shadow:var(--shadow)}
svg.art{display:block;width:100%;height:auto}
.lab{background:var(--surface);border:1px solid var(--rule-strong);border-radius:12px;
  box-shadow:var(--shadow);overflow:hidden}
.lab-head{display:flex;flex-wrap:wrap;gap:.6rem;align-items:baseline;justify-content:space-between;
  padding:.75rem 1rem;background:var(--surface-2);border-bottom:1px solid var(--rule)}
.lab-head .eyebrow{color:var(--blue)}
.lab-head h3{font-size:1rem}
.lab-body{padding:1rem}
.lab-body > * + *{margin-top:.9rem}
.controls{display:flex;flex-wrap:wrap;gap:.5rem .8rem;align-items:center;font-family:"Archivo",sans-serif;font-size:.83rem}
.controls label{display:flex;align-items:center;gap:.4rem;color:var(--ink-2)}
button{font:inherit;font-family:"Archivo",sans-serif;font-size:.83rem;font-weight:600;
  background:var(--surface-2);color:var(--ink);border:1px solid var(--rule-strong);
  border-radius:6px;padding:.32rem .7rem;cursor:pointer}
button:hover{background:var(--surface-3)}
button[aria-pressed="true"],button.on{background:var(--blue);border-color:var(--blue);color:#fff}
input[type=range]{accent-color:var(--blue);width:12rem;max-width:48vw}
select{font-family:"Archivo",sans-serif;font-size:.83rem;padding:.24rem .4rem;border-radius:6px;
  border:1px solid var(--rule-strong);background:var(--surface-2);color:var(--ink)}
canvas{display:block;width:100%;background:transparent}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.55rem}
.rd{background:var(--surface-2);border:1px solid var(--rule);border-radius:8px;padding:.5rem .65rem}
.rd .k{display:block;font-family:"Archivo",sans-serif;font-size:.68rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3)}
.rd .v{font-family:"IBM Plex Mono",monospace;font-size:1rem;font-variant-numeric:tabular-nums;color:var(--ink)}
.rd.good{border-color:var(--teal);background:var(--teal-soft)}
.rd.bad{border-color:var(--crimson);background:var(--crimson-soft)}
.verdict{font-family:"Archivo",sans-serif;font-size:.88rem;font-weight:600;padding:.5rem .75rem;
  border-radius:8px;border:1px solid var(--rule)}
.verdict.good{background:var(--teal-soft);border-color:var(--teal);color:var(--ink)}
.verdict.bad{background:var(--crimson-soft);border-color:var(--crimson);color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1rem;font-family:"Archivo",sans-serif;font-size:.78rem;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:.35rem}
.swatch{width:14px;height:3px;border-radius:2px;display:inline-block}
.swatch.dot{width:9px;height:9px;border-radius:50%}

/* --- nav --------------------------------------------------------------- */
.toc{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:1rem 1.15rem}
.toc ol{list-style:none;padding:0;counter-reset:c}
.toc li{counter-increment:c;padding-left:1.9rem;position:relative;font-family:"Archivo",sans-serif;font-size:.9rem}
.toc li::before{content:counter(c);position:absolute;left:0;top:.1rem;width:1.3rem;text-align:right;
  color:var(--ink-3);font-size:.78rem;font-variant-numeric:tabular-nums}
.toc a{text-decoration:none;color:var(--ink)}
.toc a:hover{color:var(--blue)}
.toc small{display:block;color:var(--ink-3);font-size:.78rem;line-height:1.4}
.crumb{font-family:"Archivo",sans-serif;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:.5rem}
footer{padding:2.5rem 0 4rem;color:var(--ink-3);font-size:.85rem}
footer a{color:var(--ink-2)}

/* --- inline svg art classes ------------------------------------------- */
.art .fr{fill:none;stroke:var(--rule-strong);stroke-width:1}
.art .gr{fill:none;stroke:var(--rule);stroke-width:1}
.art .lbl{font-family:"Archivo",sans-serif;font-size:11px;fill:var(--ink-2)}
.art .lbl.sm{font-size:9.5px;fill:var(--ink-3)}
.art .lbl.b{font-weight:600;fill:var(--ink)}
.art .blue{fill:var(--blue)} .art .crimson{fill:var(--crimson)}
.art .teal{fill:var(--teal)} .art .graphite{fill:var(--graphite)}
.art .amber{fill:var(--amber)}
.art .sblue{fill:none;stroke:var(--blue);stroke-width:2}
.art .scrimson{fill:none;stroke:var(--crimson);stroke-width:2}
.art .steal{fill:none;stroke:var(--teal);stroke-width:2}
.art .sgraph{fill:none;stroke:var(--graphite);stroke-width:1.5}
.art .dash{stroke-dasharray:4 3}
.art .fill-blue{fill:var(--blue-soft);stroke:var(--blue);stroke-width:1.5}
.art .fill-teal{fill:var(--teal-soft);stroke:var(--teal);stroke-width:1.5}
.art .fill-crim{fill:var(--crimson-soft);stroke:var(--crimson);stroke-width:1.5}
@media (prefers-reduced-motion:no-preference){
  .art .hop{animation:hop 6s cubic-bezier(.5,0,.5,1) infinite}
  @keyframes hop{
    0%,8%{transform:translate(0,0)} 16%,24%{transform:translate(-46px,22px)}
    32%,40%{transform:translate(-70px,-14px)} 48%,56%{transform:translate(-86px,10px)}
    64%,72%{transform:translate(-93px,-4px)} 80%,100%{transform:translate(-97px,2px)}
  }
  .art .pulse{animation:pulse 4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:.75}}
}
@media print{
  .lab,.fig{break-inside:avoid} button,input,select{display:none}
  body{background:#fff}
}
</style>
